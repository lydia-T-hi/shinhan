<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>과제 마감일 관리 | 예시 웹앱</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#151515;background:#f6f6f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:880px;margin:45px auto;padding:0 22px}.label{letter-spacing:.15em;font-size:12px;font-weight:800;color:#656565}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.06em;margin:12px 0}p{color:#666;line-height:1.7}.panel{background:white;border:1px solid #ddd;border-radius:16px;padding:25px;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr 130px;gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input{width:100%;font-size:16px;padding:13px;border:1px solid #aaa;border-radius:8px;background:#fff}button{cursor:pointer;border:0;background:#111;color:white;border-radius:8px;padding:13px 20px;font-weight:700;font-size:15px}.grid button{align-self:end;height:49px}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.muted{font-size:13px;color:#777}ul{padding:0;list-style:none}li{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid #e4e4e4;gap:12px}.name{font-size:16px;font-weight:700}.status{font-size:12px;border:1px solid #bbb;border-radius:20px;padding:4px 10px;white-space:nowrap}.urgent{background:#111;color:#fff;border-color:#111}.done{text-decoration:line-through;color:#999}.actions{display:flex;align-items:center;gap:9px}.small{padding:7px 10px;font-size:12px;background:#ededed;color:#222}.error{color:#b42318;min-height:20px;font-size:13px;margin-top:12px}.empty{padding:24px;color:#777;text-align:center;border:1px dashed #bbb;border-radius:10px}.info{margin-top:24px;font-size:13px;color:#555}@media(max-width:680px){.grid{grid-template-columns:1fr}.grid button{width:100%}li{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:flex-end}}
</style></head><body><main class="wrap"><div class="label">VIBE CODING · DEMO APP</div><h1>과제 마감일 관리</h1><p>과제명과 마감일을 입력하면 남은 날짜를 계산하고, 가까운 일정부터 정렬합니다.</p><section class="panel"><h2>새 과제 등록</h2><div class="grid"><div><label for="task">과제 이름</label><input id="task" maxlength="60" placeholder="예: 데이터분석 과제"></div><div><label for="due">마감일</label><input id="due" type="date"></div><button id="add">등록하기</button></div><div class="error" id="err" aria-live="polite"></div></section><section class="panel"><div class="meta"><div><h2 style="margin:0">나의 과제 목록</h2><span class="muted" id="counter"></span></div><button class="small" id="clear">완료 항목 정리</button></div><ul id="list"></ul></section><p class="info">실습 예시 · 데이터는 현재 브라우저에 저장됩니다(localStorage). 실제 마감일을 등록하기 전에는 개인정보나 중요한 정보를 입력하지 마세요.</p></main><script>
const $=id=>document.getElementById(id);const key='vibe-demo-task-v1';let tasks=[];try{let stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))tasks=stored.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.due==='string').slice(0,200)}catch(e){};
function localToday(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('due').min=localToday();$('due').value=localToday();function days(iso){let a=iso.split('-').map(Number),b=localToday().split('-').map(Number);return Math.round((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(b[0],b[1]-1,b[2]))/86400000)}function save(){try{localStorage.setItem(key,JSON.stringify(tasks))}catch(e){$('err').textContent='브라우저 저장 공간을 사용할 수 없습니다.'}}function el(tag,txt,cls){let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}
function render(){let sorted=[...tasks].sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));let list=$('list');list.replaceChildren();$('counter').textContent=`총 ${tasks.length}개 · 미완료 ${tasks.filter(t=>!t.done).length}개`;if(!sorted.length){list.append(el('div','아직 등록된 과제가 없습니다.','empty'));return}for(let t of sorted){let li=el('li'),left=el('div'),name=el('div',t.name,t.done?'name done':'name'),sub=el('div',`마감: ${t.due}`,'muted'),right=el('div',undefined,'actions'),dd=days(t.due),status=el('span',t.done?'완료':dd<0?`${Math.abs(dd)}일 지남`:dd===0?'D-Day':`D-${dd}`,'status'+(!t.done&&dd<=3?' urgent':'')),toggle=el('button',t.done?'되돌리기':'완료','small'),del=el('button','삭제','small');toggle.onclick=()=>{t.done=!t.done;save();render()};del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};left.append(name,sub);right.append(status,toggle,del);li.append(left,right);list.append(li)}}
$('add').onclick=()=>{let name=$('task').value.trim(),due=$('due').value;let err=$('err');err.textContent='';if(!name){err.textContent='과제 이름을 입력하세요.';return}if(!/^\d{4}-\d{2}-\d{2}$/.test(due)||Number.isNaN(new Date(due+'T00:00:00').getTime())){err.textContent='올바른 마감 날짜를 선택하세요.';return}if(due<localToday()){err.textContent='마감일은 오늘 또는 이후로 선택하세요.';return}tasks.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),name,due,done:false});$('task').value='';save();render()};$('clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};$('task').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});render();
</script></body></html>
